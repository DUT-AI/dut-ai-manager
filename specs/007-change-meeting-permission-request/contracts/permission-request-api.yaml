openapi: 3.1.0
info:
  title: Permission Request API - CHANGE_MEETING Feature
  version: 1.0.0
  description: Specification for the CHANGE_MEETING permission request category and seat availability endpoints.

paths:
  /api/v1/permission-requests:
    post:
      summary: Tạo đơn xin phép (bao gồm đổi buổi sinh hoạt CHANGE_MEETING)
      operationId: createPermissionRequest
      tags:
        - Permission Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionRequestCreate'
      responses:
        '200':
          description: Đơn xin phép được tạo và xử lý thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissionRequest'
        '400':
          description: Lỗi dữ liệu không hợp lệ hoặc buổi họp đích đã hết chỗ / đã diễn ra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Không tìm thấy buổi họp hoặc người dùng

  /api/v1/meetings/available-seats:
    get:
      summary: Lấy danh sách các buổi họp sắp tới kèm số ghế khả dụng
      operationId: getUpcomingMeetingsWithSeats
      tags:
        - Meeting
      parameters:
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Thời điểm bắt đầu lọc (mặc định là hiện tại UTC+7)
      responses:
        '200':
          description: Danh sách buổi họp và số lượng ghế khả dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMeetingSeatsList'

components:
  schemas:
    RequestCategory:
      type: string
      enum:
        - ABSENCE
        - POSTPONE
        - LATE
        - OTHER
        - CHANGE_MEETING

    PermissionRequestCreate:
      type: object
      required:
        - category
        - note
      properties:
        category:
          $ref: '#/components/schemas/RequestCategory'
        note:
          type: string
          maxLength: 500
          description: Lý do xin phép / xin đổi ca
        homework_id:
          type: integer
          nullable: true
          description: ID bài tập (bắt buộc khi category = POSTPONE)
        meeting_id:
          type: integer
          nullable: true
          description: ID buổi họp đích (bắt buộc khi category = ABSENCE, LATE, hoặc CHANGE_MEETING)
        old_meeting_id:
          type: integer
          nullable: true
          description: ID buổi họp cũ (dùng khi category = CHANGE_MEETING, để null nếu chưa có buổi học)
        start_time:
          type: string
          format: date-time
          nullable: true
          description: Giờ xin đến (khi LATE) hoặc thời gian gia hạn (khi POSTPONE)

    UserRefDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        avatar_url:
          type: string
          nullable: true

    MeetingSimpleDto:
      type: object
      required:
        - id
        - title
        - start_time
        - end_time
      properties:
        id:
          type: integer
        title:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    PermissionRequestResponse:
      type: object
      required:
        - id
        - category
        - note
        - created_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category:
          $ref: '#/components/schemas/RequestCategory'
        note:
          type: string
        homework_id:
          type: integer
          nullable: true
        meeting_id:
          type: integer
          nullable: true
        old_meeting_id:
          type: integer
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        owner:
          $ref: '#/components/schemas/UserRefDto'
        meeting:
          $ref: '#/components/schemas/MeetingSimpleDto'
        old_meeting:
          $ref: '#/components/schemas/MeetingSimpleDto'

    MeetingSeatAvailabilityDto:
      type: object
      required:
        - id
        - title
        - start_time
        - end_time
        - max_seats
        - occupied_seats
        - available_seats
        - is_full
      properties:
        id:
          type: integer
        title:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        max_seats:
          type: integer
          example: 35
        occupied_seats:
          type: integer
          example: 28
        available_seats:
          type: integer
          example: 7
        is_full:
          type: boolean
          example: false

    ApiResponsePermissionRequest:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PermissionRequestResponse'
        message:
          type: string
          example: "Đổi buổi sinh hoạt thành công"

    ApiResponseMeetingSeatsList:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MeetingSeatAvailabilityDto'

    ApiErrorResponse:
      type: object
      required:
        - success
        - detail
      properties:
        success:
          type: boolean
          example: false
        detail:
          type: string
          example: "Buổi họp đích đã hết chỗ ngồi (0/35)"
